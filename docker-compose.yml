services:
  postgres:
    image: postgres:16-alpine
    container_name: triajemedicou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triajemedicou}
      POSTGRES_USER: ${POSTGRES_USER:-triajemedicou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triajemedicou}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
